name: dart_diff_cli
description: Runs Dart/Flutter tests, analysis and formatting only for what a change affects - the tests that import the changed code, affected packages, changed files.
version: 0.1.2+2
homepage: https://github.com/ProjectAJ14/flutter_diff_action
documentation: https://github.com/ProjectAJ14/flutter_diff_action/tree/main/packages/dart_diff_cli
repository: https://github.com/ProjectAJ14/flutter_diff_action/tree/main/packages/dart_diff_cli
issue_tracker: https://github.com/ProjectAJ14/flutter_diff_action/issues

topics:
  - git
  - diff
  - cli

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  args: ^2.7.0
  cli_completion: ^0.5.1
  mason_logger: ^0.3.2
  pub_updater: ^0.5.0

dev_dependencies:
  build_runner: ^2.4.15
  build_verify: ^3.1.1
  build_version: ^2.1.1
  lints: ^5.1.1
  mocktail: ^1.0.5
  test: ^1.26.3

executables:
  dart_diff:
  ddf: