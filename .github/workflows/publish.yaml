name: 📦 Publish to pub.dev

# Dispatched on the tag by semantic-release.yaml; a tag pushed by hand also works.
on:
  push:
    tags: ['dart_diff_cli-v[0-9]*']
  workflow_dispatch:

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/dart_diff_cli-v')
    permissions:
      id-token: write  # 🔑 pub.dev OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/dart_diff_cli
      environment: pub.dev
