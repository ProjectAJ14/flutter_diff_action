name: test

on:
  pull_request:
    branches:
      - main

# A new push to the pull request cancels the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: ['3.6.0', stable]
    name: CLI - ${{ matrix.os }} - Dart ${{ matrix.sdk }}
    defaults:
      run:
        shell: bash
        working-directory: packages/dart_diff_cli
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      # The root workspace (melos 7) needs Dart 3.9, so on the minimum SDK
      # resolve the CLI on its own, as the Action does.
      - name: Resolve the CLI outside the workspace
        if: matrix.sdk == '3.6.0'
        run: printf 'resolution:\n' > pubspec_overrides.yaml

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool bin

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Check coverage (100%)
        if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: bash tool/coverage.sh

  # One job per Flutter version, one step per command: Flutter is set up and
  # the CLI compiled once. Each step runs even after one fails (!cancelled()).
  # A pull request rarely changes the example, so a diff-based step usually
  # runs nothing; the run-all steps run the command for real.
  test_simple_app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.27.0 is the minimum supported Flutter (Dart 3.6); 'stable' is the latest release ('any' to flutter-action).
        flutter: ['3.27.0', stable]
    name: Simple App - Flutter ${{ matrix.flutter }}
    defaults:
      run:
        working-directory: 'example/simple_app'
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter == 'stable' && 'any' || matrix.flutter }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: flutter test
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: flutter test
          working-dir: 'example/simple_app'
          use-melos: false
          run-all: false
          debug: true

      - name: flutter test --no-pub --coverage (all)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: flutter test --no-pub --coverage
          working-dir: 'example/simple_app'
          use-melos: false
          run-all: true
          debug: true

      - name: flutter test --plain-name "Counter increments" (all)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: 'flutter test --plain-name "Counter increments"'
          working-dir: 'example/simple_app'
          use-melos: false
          run-all: true
          debug: true

      - name: flutter analyze
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: flutter analyze
          working-dir: 'example/simple_app'
          use-melos: false
          run-all: false
          debug: true

      - name: flutter analyze --fatal-infos (all)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: flutter analyze --fatal-infos
          working-dir: 'example/simple_app'
          use-melos: false
          run-all: true
          debug: true

      - name: dart format
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: dart format
          working-dir: 'example/simple_app'
          use-melos: false
          run-all: false
          debug: true

      - name: dart format --set-exit-if-changed (all)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: dart format --set-exit-if-changed
          working-dir: 'example/simple_app'
          use-melos: false
          run-all: true
          debug: true

  test_super_app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.27.0 is the minimum supported Flutter (Dart 3.6); 'stable' is the latest release ('any' to flutter-action).
        flutter: ['3.27.0', stable]
    name: Super App - Flutter ${{ matrix.flutter }}
    defaults:
      run:
        working-directory: 'example/super_app'
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter == 'stable' && 'any' || matrix.flutter }}
          channel: 'stable'
          cache: true

      # Pub picks the newest melos the SDK allows: 6.3.2 on Flutter 3.27 (reads
      # melos.yaml), 8.x on stable, which hands off to the app's local melos 7.
      - name: Install Melos
        run: dart pub global activate melos '>=6.3.2 <9.0.0'

      # A pub workspace resolves at the root. melos 6's bootstrap would write
      # pubspec_overrides.yaml for app -> auth -> core, which pub rejects in a workspace.
      - name: Install dependencies
        run: flutter pub get

      - name: flutter test
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: flutter test
          working-dir: 'example/super_app'
          use-melos: true
          run-all: false
          debug: true

      - name: flutter test --no-pub --coverage (all)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: flutter test --no-pub --coverage
          working-dir: 'example/super_app'
          use-melos: true
          run-all: true
          debug: true

      - name: flutter analyze
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: flutter analyze
          working-dir: 'example/super_app'
          use-melos: true
          run-all: false
          debug: true

      - name: flutter analyze --fatal-infos (all)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: flutter analyze --fatal-infos
          working-dir: 'example/super_app'
          use-melos: true
          run-all: true
          debug: true

      - name: dart format
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: dart format
          working-dir: 'example/super_app'
          use-melos: true
          run-all: false
          debug: true

      - name: dart format --set-exit-if-changed (all)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          branch: ${{ github.base_ref }}
          command: dart format --set-exit-if-changed
          working-dir: 'example/super_app'
          use-melos: true
          run-all: true
          debug: true

  # The project is the git repo root, and the Action's exit code follows the command's.
  # Layout (both under $GITHUB_WORKSPACE, which is not itself a repo):
  #   action-src/  this repo, used as the Action
  #   fixture/     a fresh repo made from example/simple_app, 'origin' is ../origin.git
  test_repo_root:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.27.0', stable]
        expect: [success, failure]
    name: Repo Root - Flutter ${{ matrix.flutter }} - expect ${{ matrix.expect }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          path: action-src

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter == 'stable' && 'any' || matrix.flutter }}
          channel: 'stable'
          cache: true

      - name: Create fixture repo
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          cp -R action-src/example/simple_app fixture
          cd fixture
          printf '.dart_tool/\nbuild/\ncoverage/\n' > .gitignore
          flutter pub get
          git init -b main
          git config user.name ci
          git config user.email ci@example.com
          git add -A
          git commit -m init
          git clone --bare . ../origin.git
          git remote add origin ../origin.git
          git fetch origin
          git checkout -b feature
          echo '// changed' >> lib/main.dart
          if [ "$EXPECT" = failure ]; then
            printf "import 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('fails', () => expect(1, 2));\n}\n" > test/fail_test.dart
          fi
          git add -A
          git commit -m change

      - name: Run Flutter Diff Action
        id: diff
        continue-on-error: true
        uses: ./action-src
        with:
          branch: main
          command: flutter test
          working-dir: fixture
          debug: true

      - name: Check outcome
        env:
          OUTCOME: ${{ steps.diff.outcome }}
          EXPECT: ${{ matrix.expect }}
        run: |
          echo "outcome=$OUTCOME expected=$EXPECT"
          [ "$OUTCOME" = "$EXPECT" ]

  # Monorepo selection and the Action's outputs, on a fresh repo made from
  # example/super_app (core <- auth <- app; api is on its own).
  test_outputs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.27.0', stable]
    name: Outputs - Flutter ${{ matrix.flutter }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          path: action-src

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter == 'stable' && 'any' || matrix.flutter }}
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos '>=6.3.2 <9.0.0'

      - name: Create fixture repo
        id: fixture
        run: |
          cp -R action-src/example/super_app fixture
          cd fixture
          printf '.dart_tool/\nbuild/\ncoverage/\npubspec.lock\npubspec_overrides.yaml\n.flutter-plugins*\n' > .gitignore
          git init -b main
          git config user.name ci
          git config user.email ci@example.com
          git add -A
          git commit -m init
          git clone --bare . ../origin.git
          git remote add origin ../origin.git
          git fetch origin
          flutter pub get
          echo "main=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git checkout -b core
          echo '// changed' >> feature/core/lib/core.dart
          git commit -am 'change core'
          git checkout -b root main
          echo '# changed' >> pubspec.yaml
          git commit -am 'change the workspace pubspec'
          # A pull request's merge commit, as actions/checkout checks it out.
          git checkout -b pr main
          git merge --no-ff -m 'merge core' core
          git push origin pr
          git checkout core

      - name: Core change, melos
        id: core
        uses: ./action-src
        with:
          command: flutter test
          use-melos: true
          working-dir: fixture
          branch: main
          debug: true

      - name: Core change, one package, compared with a commit
        id: app
        uses: ./action-src
        with:
          command: flutter test
          working-dir: fixture/app/super_app
          base: ${{ steps.fixture.outputs.main }}

      - name: Core change, dry run of an unrelated package
        id: api
        uses: ./action-src
        with:
          working-dir: fixture/feature/api
          branch: main

      # Depth 1, like actions/checkout: the Action must deepen it to find the merge base.
      - name: Shallow clone of the merge commit
        run: |
          git clone --depth 1 -b pr "file://$PWD/origin.git" shallow
          cd shallow
          flutter pub get

      - name: Core change, melos, shallow merge commit
        id: shallow
        uses: ./action-src
        with:
          command: flutter test
          use-melos: true
          working-dir: shallow
          branch: main

      - name: Switch to the workspace change
        run: git -C fixture checkout root

      - name: Workspace change, melos
        id: root
        uses: ./action-src
        with:
          command: flutter analyze
          use-melos: true
          working-dir: fixture
          branch: main

      - name: Check outputs
        env:
          CORE: ${{ toJSON(steps.core.outputs) }}
          APP: ${{ toJSON(steps.app.outputs) }}
          API: ${{ toJSON(steps.api.outputs) }}
          ROOT: ${{ toJSON(steps.root.outputs) }}
          SHALLOW: ${{ toJSON(steps.shallow.outputs) }}
        run: |
          set -x
          # The dependents of core run, api doesn't.
          jq -e '.ran == "partial" and (.packages | fromjson | sort) == ["app/super_app", "feature/auth", "feature/core"]' <<< "$CORE"
          jq -e '(."test-files" | fromjson | sort) == ["app/super_app/test/main_test.dart", "feature/auth/test/auth_test.dart", "feature/core/test/core_test.dart"]' <<< "$CORE"
          jq -e '."changed-files" == "[\"feature/core/lib/core.dart\"]"' <<< "$CORE"
          jq -e '.ran == "partial" and ."test-files" == "[\"app/super_app/test/main_test.dart\"]"' <<< "$APP"
          jq -e '.ran == "none" and .skipped == "true" and .packages == "[]"' <<< "$API"
          # The shallow clone was deepened just enough to find the merge base.
          jq -e '.ran == "partial" and (.packages | fromjson | sort) == ["app/super_app", "feature/auth", "feature/core"]' <<< "$SHALLOW"
          git -C shallow merge-base origin/main HEAD
          [ "$(git -C shallow rev-parse --is-shallow-repository)" = true ]
          # The root pubspec.yaml is outside every package, yet all of them run.
          jq -e '.ran == "full" and ."full-suite" == "true" and (.packages | fromjson | length) == 4' <<< "$ROOT"

  verify_tests:
    name: Verify All Tests
    needs: [test_cli, test_simple_app, test_super_app, test_repo_root, test_outputs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  test_action:
    name: test_action
    needs: verify_tests
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "All tests passed"
