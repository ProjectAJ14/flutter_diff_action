name: 🎯 Semantic Release

on:
  push:
    branches: [main]
  workflow_dispatch:  # 🔄 Manual trigger (also prereleases on other branches)

# One release at a time. Queued runs check out the latest branch tip.
# Pushes use the release GitHub App's token (RELEASE_APP_ID and
# RELEASE_APP_PRIVATE_KEY), which the main ruleset lets bypass PRs and checks.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_cli:       # 📦 Version the CLI with Melos, then publish it to pub.dev
    name: 📦 Release CLI
    # The App's own release commit must not start another release.
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔑 Create release App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: 🎯 Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: 📦 Install dependencies
        run: dart pub get

      - name: 🏷️ Version the CLI
        id: version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          dart run melos version --yes
          tag=$(git tag --points-at HEAD 'dart_diff_cli-v*')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "CLI release: ${tag:-none}"

      # Atomic, so if main moved, neither the commit nor the tag lands.
      # The tag push (App token, not GITHUB_TOKEN) triggers publish.yaml.
      - name: ⬆️ Push release commit and tag
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

  create_release:    # 📦 Create and publish release
    name: 🚀 Generate Release
    needs: release_cli
    if: >-
      !failure() && !cancelled() &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🔑 Create release App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write        # 📝 Commit CHANGELOG.md, tags, releases
          permission-issues: write          # 🎫 Release comments
          permission-pull-requests: write   # 🔀 Release comments

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # 🔁 Includes the CLI release commit
          fetch-depth: 0     # 📚 Full git history for versioning
          persist-credentials: false  # 🔒 Security best practice

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4.2.0

      - name: 🔧 Configure Prerelease
        if: github.ref != 'refs/heads/main'
        run: mv .releaserc.prerelease.yaml .releaserc.yaml
        # 📋 Apply prerelease configuration for non-main branches

      - name: 🏷️ Generate Semantic Release
        uses: cycjimmy/semantic-release-action@v4.1.1
        id: semantic   # 🔍 Reference for output steps
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}  # 🔑 Authentication

      # Users pin `@v<major>`, so point it at each stable release.
      - name: 🔖 Move major version tag
        if: steps.semantic.outputs.new_release_published == 'true' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
          MAJOR: ${{ steps.semantic.outputs.new_release_major_version }}
        run: |
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/v${VERSION}^{commit}:refs/tags/v${MAJOR}"

      - name: 📊 Display Release Information
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "📌 Release Version: ${{ steps.semantic.outputs.new_release_version }}"
          echo "⬆️ Major Version: ${{ steps.semantic.outputs.new_release_major_version }}"
          echo "➕ Minor Version: ${{ steps.semantic.outputs.new_release_minor_version }}"
          echo "🔨 Patch Version: ${{ steps.semantic.outputs.new_release_patch_version }}"