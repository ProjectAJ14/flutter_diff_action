name: Flutter Diff Action
description: Run Flutter/Dart commands with diff checking capabilities.
author: ProjectAJ14
branding:
  icon: zap
  color: blue

inputs:
  command:
    description: The Flutter command to execute (e.g., flutter test, dart format)
    required: true
  use-melos:
    description: Whether to execute the command using Melos for mono-repo support
    required: false
    default: 'false'
  working-dir:
    description: The working directory to run the command from
    required: false
    default: '.'
  debug:
    description: Enable debug output for troubleshooting
    required: false
    default: 'false'
  branch:
    description: Base branch for comparison
    required: false
    default: 'main'
  remote:
    description: Remote repository name
    required: false
    default: 'origin'
  include-dependency-tests:
    description: Include tests for files that use changed dependencies
    required: false
    default: 'false'
  dependency-scan-depth:
    description: Comma-separated list of directories to scan for dependency usage
    required: false
    default: 'lib/,test/'

runs:
  using: composite
  steps:
    - name: Set up dart-diff
      shell: bash
      run: dart pub global activate dart_diff_cli
      working-directory: ${{ github.workspace }}
      # TODO(Droyder7): Replace with the published package once it's published

    - name: Run exec command
      if: ${{ inputs.use-melos == 'false' }}
      shell: bash
      run: |
        CMD="dart_diff exec --branch ${{ inputs.branch }} --remote ${{ inputs.remote }}"
        if [ "${{ inputs.include-dependency-tests }}" = "true" ]; then
          CMD="$CMD --include-dependency-tests"
        fi
        if [ "${{ inputs.dependency-scan-depth }}" != "lib/,test/" ]; then
          CMD="$CMD --dependency-scan-depth '${{ inputs.dependency-scan-depth }}'"
        fi
        CMD="$CMD -- ${{ inputs.command }}"
        eval $CMD
      working-directory: ${{ inputs.working-dir }}

    - name: Run melos command
      if: ${{ inputs.use-melos == 'true' }}
      shell: bash
      run: |
        CMD="dart_diff exec --branch ${{ inputs.branch }} --remote ${{ inputs.remote }}"
        if [ "${{ inputs.include-dependency-tests }}" = "true" ]; then
          CMD="$CMD --include-dependency-tests"
        fi
        if [ "${{ inputs.dependency-scan-depth }}" != "lib/,test/" ]; then
          CMD="$CMD --dependency-scan-depth '${{ inputs.dependency-scan-depth }}'"
        fi
        CMD="$CMD -- ${{ inputs.command }}"
        melos exec --diff=${{inputs.remote}}/${{ inputs.branch }} -- $CMD
      working-directory: ${{ inputs.working-dir }}
