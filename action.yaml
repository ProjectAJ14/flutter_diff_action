name: Flutter Diff Action
description: Run Flutter/Dart commands with diff checking capabilities.
author: ProjectAJ14
branding:
  icon: zap
  color: blue

inputs:
  command:
    description: The Flutter command to execute (e.g., flutter test, dart format)
    required: true
  use-melos:
    description: Whether to execute the command using Melos for mono-repo support
    required: false
    default: 'false'
  working-dir:
    description: The working directory to run the command from
    required: false
    default: '.'
  debug:
    description: Enable debug output for troubleshooting
    required: false
    default: 'false'
  branch:
    description: Base branch for comparison
    required: false
    default: 'main'
  remote:
    description: Remote repository name
    required: false
    default: 'origin'

runs:
  using: composite
  steps:
    - name: Set up dart-diff
      shell: bash
      env:
        DIFF_BRANCH: ${{ inputs.branch }}
        DIFF_REMOTE: ${{ inputs.remote }}
      run: |
        # Branch and remote reach git and (in melos mode) a shell, so allow only plain ref characters.
        for value in "$DIFF_BRANCH" "$DIFF_REMOTE"; do
          case "$value" in
            '' | -* | *[!A-Za-z0-9._/@+-]*)
              echo "::error::Invalid branch or remote name: '$value'"
              exit 1
              ;;
          esac
        done
        # Resolve the CLI on its own, not as part of this repo's pub workspace,
        # whose dev tooling (melos 7) needs a newer Dart than the CLI does.
        cli="$GITHUB_ACTION_PATH/packages/dart_diff_cli"
        printf 'resolution:\n' > "$cli/pubspec_overrides.yaml"
        dart pub global activate --source path "$cli"
      working-directory: ${{ github.workspace }}

    - name: Run exec command
      if: ${{ inputs.use-melos != 'true' }}
      shell: bash
      env:
        DIFF_COMMAND: ${{ inputs.command }}
        DIFF_BRANCH: ${{ inputs.branch }}
        DIFF_REMOTE: ${{ inputs.remote }}
        DIFF_DEBUG: ${{ inputs.debug }}
      run: |
        verbose=
        if [ "$DIFF_DEBUG" = "true" ]; then verbose=--verbose; fi
        # $DIFF_COMMAND is unquoted on purpose: it is split into the command and
        # its arguments (e.g. "flutter test --coverage"). set -f stops globbing.
        set -f
        dart_diff $verbose exec --branch "$DIFF_BRANCH" --remote "$DIFF_REMOTE" -- $DIFF_COMMAND
      working-directory: ${{ inputs.working-dir }}

    - name: Run melos command
      if: ${{ inputs.use-melos == 'true' }}
      shell: bash
      env:
        DIFF_COMMAND: ${{ inputs.command }}
        DIFF_BRANCH: ${{ inputs.branch }}
        DIFF_REMOTE: ${{ inputs.remote }}
        DIFF_DEBUG: ${{ inputs.debug }}
      run: |
        # Fetch once here instead of once per package.
        git fetch "$DIFF_REMOTE" "$DIFF_BRANCH" || echo "::warning::git fetch failed, using the local $DIFF_REMOTE/$DIFF_BRANCH"
        verbose=
        if [ "$DIFF_DEBUG" = "true" ]; then verbose=--verbose; fi
        # $DIFF_COMMAND is unquoted on purpose: it is split into the command and
        # its arguments (e.g. "flutter test --coverage"). set -f stops globbing.
        # melos joins everything after "--" and runs it through a shell per package.
        set -f
        melos exec --diff="$DIFF_REMOTE/$DIFF_BRANCH" -- dart_diff $verbose exec --no-fetch --branch "$DIFF_BRANCH" --remote "$DIFF_REMOTE" -- $DIFF_COMMAND
      working-directory: ${{ inputs.working-dir }}
