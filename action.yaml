name: Flutter Diff Action
description: Run Dart/Flutter tests, analysis or formatting only for what a change affects - affected tests, changed files, changed packages.
author: ProjectAJ14
branding:
  icon: zap
  color: blue

inputs:
  command:
    description: The command to run, e.g. flutter test, flutter analyze or dart format. Leave it empty to only set the outputs.
    required: false
    default: ''
  mode:
    description: >-
      What to pass to the command: test (the tests that use the changed files), files (the changed Dart files),
      package (nothing: run the whole command when the package, or a file it uses, changed) or auto
      (test for flutter/dart test, package for flutter/dart analyze, files otherwise).
    required: false
    default: 'auto'
  base:
    description: >-
      Commit or ref to compare with. Defaults to <remote>/<branch> when branch is set, otherwise to the pull request's
      base branch, the merge group's base, or on push the commit before the push (a new branch runs everything).
    required: false
    default: ''
  branch:
    description: Base branch to compare with (see base). Falls back to main when the event gives no base.
    required: false
    default: ''
  remote:
    description: Remote repository name
    required: false
    default: 'origin'
  run-all:
    description: Run on everything, without looking at the changes, e.g. to collect full coverage.
    required: false
    default: 'false'
  run-all-on:
    description: Newline-separated globs, relative to the repository root (e.g. .github/workflows/**). A changed file matching one runs everything. No spaces.
    required: false
    default: ''
  use-melos:
    description: Whether to execute the command using Melos for mono-repo support
    required: false
    default: 'false'
  include-dependents:
    description: With use-melos, also run in the packages that depend on a changed package.
    required: false
    default: 'true'
  working-dir:
    description: The working directory to run the command from
    required: false
    default: '.'
  debug:
    description: Enable debug output for troubleshooting
    required: false
    default: 'false'

outputs:
  ran:
    description: 'none, partial or full: whether the command ran on nothing, on some files or on everything (every package).'
    value: ${{ steps.report.outputs.ran }}
  full-suite:
    description: "'true' when the command ran on everything, e.g. so a coverage gate can run only then."
    value: ${{ steps.report.outputs.full-suite }}
  skipped:
    description: "'true' when nothing ran."
    value: ${{ steps.report.outputs.skipped }}
  changed-files:
    description: JSON array of the changed files, relative to the repository root.
    value: ${{ steps.report.outputs.changed-files }}
  files:
    description: JSON array of the files passed to the command, relative to the repository root.
    value: ${{ steps.report.outputs.files }}
  test-files:
    description: JSON array of the test files passed to the command.
    value: ${{ steps.report.outputs.test-files }}
  packages:
    description: JSON array of the package directories where the command ran (or would run), relative to the repository root.
    value: ${{ steps.report.outputs.packages }}

runs:
  using: composite
  steps:
    - name: Set up dart-diff
      id: setup
      shell: bash
      run: |
        set -eo pipefail
        # Compile the CLI of this Action's own ref once per job: it starts
        # faster than `dart pub global run`, which resolves on every call.
        # It is resolved in a copy, on its own, not as part of this repo's
        # pub workspace, whose dev tooling (melos 7) needs a newer Dart.
        dir="$RUNNER_TEMP/dart_diff"
        exe="$dir/bin/dart_diff"
        if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
        if [ ! -f "$exe" ] || [ "$(cat "$dir/source" 2>/dev/null)" != "$GITHUB_ACTION_PATH" ]; then
          src="$GITHUB_ACTION_PATH/packages/dart_diff_cli"
          rm -rf "$dir"
          mkdir -p "$dir/bin" "$dir/cli"
          cp -R "$src/bin" "$src/lib" "$dir/cli/"
          # Without dev_dependencies (build_runner, test, ...): about 50 fewer
          # packages to download, none of them needed to compile.
          awk '/^dev_dependencies:/ { skip = 1; next } /^[^ ]/ { skip = 0 } !skip' \
            "$src/pubspec.yaml" > "$dir/cli/pubspec.yaml"
          printf 'resolution:\n' > "$dir/cli/pubspec_overrides.yaml"
          # Pinned versions, resolved on the minimum Dart (3.6): a new release
          # of a dependency can't change or break the Action.
          cp "$src/tool/action.lock" "$dir/cli/pubspec.lock"
          (cd "$dir/cli" && dart pub get --enforce-lockfile && dart compile exe bin/dart_diff.dart -o "$exe")
          echo "$GITHUB_ACTION_PATH" > "$dir/source"
        fi
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "report=$(mktemp -d "$RUNNER_TEMP/dart_diff_report.XXXXXX")" >> "$GITHUB_OUTPUT"
      working-directory: ${{ github.workspace }}

    - name: Run dart-diff
      shell: bash
      env:
        DIFF_COMMAND: ${{ inputs.command }}
        DIFF_MODE: ${{ inputs.mode }}
        DIFF_BASE: ${{ inputs.base }}
        DIFF_BRANCH: ${{ inputs.branch }}
        DIFF_REMOTE: ${{ inputs.remote }}
        DIFF_RUN_ALL: ${{ inputs.run-all }}
        DIFF_RUN_ALL_ON: ${{ inputs.run-all-on }}
        DIFF_USE_MELOS: ${{ inputs.use-melos }}
        DIFF_INCLUDE_DEPENDENTS: ${{ inputs.include-dependents }}
        DIFF_DEBUG: ${{ inputs.debug }}
        DIFF_REPORT: ${{ steps.setup.outputs.report }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_REF: ${{ github.base_ref }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        # What to compare with.
        base=$DIFF_BASE branch=
        if [ -z "$base" ]; then
          if [ -n "$DIFF_BRANCH" ]; then branch=$DIFF_BRANCH
          elif [ -n "$PR_BASE_REF" ]; then branch=$PR_BASE_REF
          elif [ -n "$MERGE_GROUP_BASE" ]; then base=$MERGE_GROUP_BASE
          elif [ "$EVENT_NAME" = push ] && [ -n "$PUSH_BEFORE" ]; then base=$PUSH_BEFORE
          else branch=main
          fi
        fi
        run_all=$DIFF_RUN_ALL
        # A pushed new branch has no "before": run everything.
        if [ "$base" = 0000000000000000000000000000000000000000 ]; then base= branch=main run_all=true; fi

        # They reach git and (in melos mode) a shell, so allow only plain ref characters.
        for value in "$DIFF_REMOTE" "${base:-$branch}"; do
          case "$value" in
            '' | -* | *[!A-Za-z0-9._/@+-]*)
              echo "::error::Invalid base, branch or remote: '$value'"
              exit 1
              ;;
          esac
        done
        case "$DIFF_MODE" in
          auto | test | files | package) ;;
          *) echo "::error::Invalid mode: '$DIFF_MODE'"; exit 1 ;;
        esac

        verbose=
        if [ "$DIFF_DEBUG" = true ]; then verbose=--verbose; fi
        args=(--remote "$DIFF_REMOTE" --mode "$DIFF_MODE" --report "$DIFF_REPORT")
        if [ -n "$base" ]; then args+=(--base "$base"); ref=$base
        else args+=(--branch "$branch"); ref=$DIFF_REMOTE/$branch
        fi
        if [ "$run_all" = true ]; then args+=(--all); fi
        while IFS= read -r glob; do
          glob=${glob%$'\r'}
          if [ -n "$glob" ]; then args+=("--run-all-on=$glob"); fi
        done <<< "$DIFF_RUN_ALL_ON"
        if [ -z "$DIFF_COMMAND" ]; then args+=(--dry-run); fi

        if [ "$DIFF_USE_MELOS" != true ]; then
          # The command is the workflow author's own input and keeps shell
          # quoting (e.g. --plain-name "login flow"), so it is evaluated. The
          # other arguments stay quoted inside the eval.
          eval 'dart_diff $verbose exec "${args[@]}" -- '"$DIFF_COMMAND"
          exit
        fi

        filters=()
        if [ "$run_all" != true ]; then
          # Fetch, and deepen a shallow clone, once here instead of in every package.
          if [ -n "$base" ]; then fetch=$base; else fetch=+refs/heads/$branch:refs/remotes/$DIFF_REMOTE/$branch; fi
          git fetch "$DIFF_REMOTE" "$fetch" || echo "::warning::git fetch failed, using the local $ref"
          # A pull request's merge commit needs only 1: its first parent is the base.
          for depth in 1 100 1000; do
            if git merge-base "$ref" HEAD > /dev/null 2>&1 || [ "$(git rev-parse --is-shallow-repository)" != true ]; then break; fi
            git fetch --deepen="$depth" "$DIFF_REMOTE" "$fetch"
            git fetch --deepen="$depth" "$DIFF_REMOTE" "$(git rev-parse HEAD)"
          done
          filters=(--diff="$ref")
          if [ "$DIFF_INCLUDE_DEPENDENTS" = true ]; then filters+=(--include-dependents); fi
          # --diff only sees changes inside packages. When a file at the root
          # (pubspec.lock, analysis_options.yaml, ...) or a run-all-on glob
          # may matter, dart_diff decides in every package.
          merge_base=$(git merge-base "$ref" HEAD 2> /dev/null) || merge_base=$ref
          if [ -n "$DIFF_RUN_ALL_ON" ] || git diff --name-only --relative "$merge_base" | grep -qv /; then filters=(); fi
        fi
        # $DIFF_COMMAND is unquoted on purpose: it is split into the command and
        # its arguments (e.g. "flutter test --coverage"). set -f stops globbing.
        # melos joins everything after "--" and runs it through a shell per package.
        set -f
        melos exec "${filters[@]}" -- dart_diff $verbose exec --no-fetch "${args[@]}" -- $DIFF_COMMAND
      working-directory: ${{ inputs.working-dir }}

    - name: Report
      id: report
      if: always() && steps.setup.outcome == 'success'
      shell: bash
      env:
        DIFF_REPORT: ${{ steps.setup.outputs.report }}
      run: dart_diff report --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" "$DIFF_REPORT"
